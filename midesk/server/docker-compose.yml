# Servidor do MiDESK (hbbs = rendezvous/ID, hbbr = relay), imagem oficial open-source do RustDesk.
# Na VPS:  mkdir -p ~/midesk-server && cd ~/midesk-server && (copie este arquivo) && docker compose up -d
# A chave pública fica em ./data/id_ed25519.pub  -> coloque o conteúdo na variável MIDESK_KEY do GitHub.
services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
