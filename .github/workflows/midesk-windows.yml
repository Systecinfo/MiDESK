# Build do MiDESK para Windows x64 + instalador pequeno (MiDESK-Setup.exe).
# Publica tudo numa Release do GitHub, de onde o MiDESK-Setup.exe baixa o programa.
#
# Como disparar:
#   - Aba Actions > "MiDESK Windows" > Run workflow   (cria a tag midesk-v<versão>-<nº do run>)
#   - ou enviando uma tag:  git tag midesk-v1.0.0 && git push origin midesk-v1.0.0
#
# Configuração (Settings > Secrets and variables > Actions > Variables):
#   MIDESK_SERVER  IP ou domínio da sua VPS com hbbs/hbbr   (opcional)
#   MIDESK_KEY     conteúdo de id_ed25519.pub da VPS          (opcional)
name: MiDESK Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "midesk-v*"

permissions:
  contents: write
  actions: read # o SignPath lê o artefato do build

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  APP_NAME: "MiDESK"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    env:
      TARGET: x86_64-pc-windows-msvc
      VCPKG_TRIPLET: x64-windows-static
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply MiDESK branding and server
        shell: bash
        env:
          MIDESK_APP_NAME: ${{ env.APP_NAME }}
          MIDESK_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          MIDESK_SERVER: ${{ vars.MIDESK_SERVER }}
          MIDESK_KEY: ${{ vars.MIDESK_KEY }}
        run: python3 midesk/brand.py

      - name: Read version and tag
        id: ver
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="midesk-v${VERSION}-${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Versão $VERSION, tag $TAG"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet $VCPKG_TRIPLET --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; done
            exit 1
          fi

      - name: Build MiDESK
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # O instalador do RustDesk cria serviço e atalhos apontando para "<APP_NAME>.exe"
          Rename-Item ./rustdesk/rustdesk.exe "${{ env.APP_NAME }}.exe"

          # Driver de monitor virtual (mesmo pacote usado pelo RustDesk oficial)
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ -n "$runner_res" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${APP_NAME}.exe"
          popd
          mkdir -p ./dist
          mv ./target/release/rustdesk-portable-packer.exe "./dist/${APP_NAME}-${VERSION}-x86_64.exe"

      # O MiDESK-Setup.exe só é recompilado quando o código do instalador muda. Assim o arquivo
      # (e o hash) fica igual entre as releases e acumula reputação no SmartScreen e nos antivírus.
      # Cada versão fica guardada na pré-release "setup-cache" como MiDESK-Setup-<chave>.exe.
      - name: Reuse MiDESK-Setup.exe if the installer did not change
        id: setup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && '1' || '0' }}
        run: |
          KEY=$( { tr -d '\r' < installer/MiDeskSetup.cs; tr -d '\r' < installer/build.ps1; sha256sum < res/icon.ico; echo "${GITHUB_REPOSITORY}|${APP_NAME}|signed=${SIGNED}"; } | sha256sum | cut -c1-16)
          ASSET="${APP_NAME}-Setup-${KEY}.exe"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          if gh release download setup-cache -R "$GITHUB_REPOSITORY" -p "$ASSET" -D setup-cache; then
            cp "setup-cache/${ASSET}" "dist/${APP_NAME}-Setup.exe"
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "Reaproveitando ${ASSET}"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "O instalador mudou: compilando ${ASSET}"
          fi

      - name: Build MiDESK-Setup.exe (instalador pequeno)
        if: steps.setup.outputs.reused != 'true'
        run: |
          .\installer\build.ps1 -Repo "${{ github.repository }}" -AppName "${{ env.APP_NAME }}" -Icon res\icon.ico
          Copy-Item .\installer\dist\MiDESK-Setup.exe .\dist\

      # Assinatura do MiDESK-Setup.exe pelo SignPath (só roda depois de configurar as variáveis
      # SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_POLICY_SLUG e o secret
      # SIGNPATH_API_TOKEN). Cada assinatura precisa ser aprovada manualmente no site do SignPath.
      - name: Upload unsigned MiDESK-Setup.exe (SignPath)
        id: upload-unsigned-setup
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && steps.setup.outputs.reused != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midesk-setup-unsigned
          path: ./dist/MiDESK-Setup.exe

      - name: Sign MiDESK-Setup.exe (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && steps.setup.outputs.reused != 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: ./signed

      - name: Use signed MiDESK-Setup.exe
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && steps.setup.outputs.reused != 'true' }}
        run: |
          Copy-Item .\signed\MiDESK-Setup.exe .\dist\MiDESK-Setup.exe -Force
          $sig = Get-AuthenticodeSignature .\dist\MiDESK-Setup.exe
          if ($sig.Status -ne 'Valid') { throw "Assinatura inválida: $($sig.Status)" }
          $sig.SignerCertificate.Subject

      - name: Save MiDESK-Setup.exe in setup-cache
        if: steps.setup.outputs.reused != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view setup-cache -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create setup-cache -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Cache do MiDESK-Setup (uso interno)" \
              --notes "Uso interno do build: guarda cada versão do MiDESK-Setup.exe para ele continuar igual entre as releases. Para instalar, use a release mais recente."
          fi
          cp "dist/${APP_NAME}-Setup.exe" "${{ steps.setup.outputs.asset }}"
          gh release upload setup-cache "${{ steps.setup.outputs.asset }}" -R "$GITHUB_REPOSITORY" --clobber

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midesk-windows-x64
          path: ./dist

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MiDESK ${{ steps.ver.outputs.tag }}
          prerelease: false
          body: |
            Baixe só o **MiDESK-Setup.exe** (~150 KB): ele busca a versão mais recente desta página, confere o SHA256, instala e ativa a atualização automática.

            [Code signing policy](https://github.com/${{ github.repository }}/blob/master/CODE_SIGNING.md) (inclui a política de privacidade).
          files: |
            ./dist/*.exe
            ./dist/SHA256SUMS.txt
